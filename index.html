  <title>Harsh Ringsia — Notebook &amp; Case Studies</title>
  <script>
    // Applied before paint so the site loads straight into the right theme
    // (dark by default) instead of flashing light first.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored || 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
