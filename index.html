<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Harsh Ringsia — software engineer building backend systems, LLM tools and security pipelines. Case studies: HireLens, The Docket, SecPipe, Para Football." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <meta name="theme-color" content="#060A17" />
  <title>Harsh Ringsia — Software Engineer</title>
  <script>
    // Applied before paint so the site loads straight into the right theme
    // (dark by default) instead of flashing light first.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored || 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
